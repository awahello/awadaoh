name: nav-image

# 极简导航站（nav/）镜像：ghcr.io/<owner>/akkdaoh-nav
on:
  push:
    branches: [main]
    paths:
      - "nav/**"
      - ".github/workflows/docker-nav.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./nav
          file: ./nav/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/akkdaoh-nav:latest
            ghcr.io/${{ github.repository_owner }}/akkdaoh-nav:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
