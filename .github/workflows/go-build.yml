name: go-build

# 后端编译 + 单元测试（Go 侧改动的守门人）
# 说明：assets/bindata.go 是 go-bindata 生成物、不入库，这里用占位实现顶上，
# 只验证「代码能不能编译、单元测试过不过」，不产出发布二进制。
on:
  push:
    paths:
      - "service/**"
      - ".github/workflows/go-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.20"
          cache-dependency-path: service/go.sum

      - name: 生成 bindata 占位
        run: |
          mkdir -p assets
          cat > assets/bindata.go <<'EOF'
          // Code generated for CI build only. Placeholder for go-bindata output.
          package assets

          import "os"

          func Asset(name string) ([]byte, error) { return os.ReadFile(name) }
          EOF

      - name: 编译
        run: go build ./...

      - name: 单元测试
        run: go test ./lib/... -v

      - name: vet
        run: go vet ./...
