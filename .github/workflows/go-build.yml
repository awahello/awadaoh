name: go-build

# 后端编译 + 单元测试（Go 侧改动的守门人）
#
# assets/bindata.go 现在是手写的 //go:embed 实现（已入库），
# 不再需要 go-bindata 生成，也不需要占位顶替。
on:
  push:
    paths:
      - "service/**"
      - ".github/workflows/go-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: service/go.sum

      - name: 确认内嵌资源可编译
        run: |
          set -euo pipefail
          head -20 assets/bindata.go
          test -f assets/conf.example.ini
          test -f assets/version
          test -d assets/lang

      - name: 编译
        run: go build ./...

      - name: 单元测试
        run: go test ./lib/... -v

      - name: vet
        run: go vet ./...
