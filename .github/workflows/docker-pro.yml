name: build-pro

# 构建 PRO 全功能镜像：
#   后端 = 上游 release 二进制 + ProIsExpired 恒 false 补丁
#   前端 = 上游同版本 web 包 + isPro 解锁 + Awadaoh 导航站主题注入
# 产出：ghcr.io/<owner>/awadaoh:latest（linux/amd64 + linux/arm64）

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '上游 release tag'
        required: false
        default: 'v2.0.2-beta261110'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 物料优先从本仓库的 release 取（tools/mirror-pro.sh 镜像上来的一次性包），
  # 只有本仓库没有对应 tag 时才回退上游同版本。
  MIRROR_REPO: ${{ github.repository }}
  UPSTREAM_TAG: v2.0.2-beta261110

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream tag
        id: up
        run: |
          TAG="${{ github.event.inputs.upstream_tag || env.UPSTREAM_TAG }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "上游版本: $TAG"

      - name: 取物料并解包（amd64 / arm64）
        run: |
          set -euo pipefail
          TAG="${{ steps.up.outputs.tag }}"
          echo "物料版本: $TAG  来源仓库: $MIRROR_REPO"
          for ARCH in amd64 arm64; do
            bash tools/fetch-pro.sh "$ARCH" "$TAG" "/tmp/rel-${ARCH}"
            ls -la "/tmp/rel-${ARCH}" | head -5
          done

      - name: 组装物料（打补丁 + 注入主题）
        run: |
          set -euo pipefail
          python3 -V
          bash tools/build-pro.sh /tmp/rel-amd64 pro/amd64
          bash tools/build-pro.sh /tmp/rel-arm64 pro/arm64
          echo "--- 产物 ---"
          ls -la pro/amd64 pro/arm64
          du -sh pro/web

      - name: 架构闸门（两个架构的二进制不能是同一个文件）
        run: |
          set -euo pipefail
          echo "--- 真实架构 ---"
          python3 tools/elfarch.py pro/amd64/awadaoh --expect amd64
          python3 tools/elfarch.py pro/arm64/awadaoh --expect arm64
          A=$(sha256sum pro/amd64/awadaoh | cut -d' ' -f1)
          B=$(sha256sum pro/arm64/awadaoh | cut -d' ' -f1)
          echo "amd64: $A"
          echo "arm64: $B"
          if [ "$A" = "$B" ]; then
            echo "::error::两个架构的二进制完全相同，说明 arm64 物料是 amd64 冒充的"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pro
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 故意不用 type=gha 缓存。
          # 上一版就是这里出的问题：amd64 与 arm64 两个 platform 共用一份 gha 缓存，
          # 推出来的镜像里 linux/arm64 那一层的 digest 和 amd64 完全相同
          # （sha256:a11a92c5…），也就是 arm64 镜像里躺着 amd64 二进制。
          # 这个镜像总共就 build 一两分钟，去掉缓存换「架构不会串」值得。
          no-cache: true

      - name: 校验已推送镜像内二进制的真实架构
        run: |
          set -euo pipefail
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "校验镜像: $TAG"
          for ARCH in amd64 arm64; do
            docker pull --platform "linux/${ARCH}" "$TAG"
            docker create --platform "linux/${ARCH}" --name "chk-${ARCH}" "$TAG"
            docker cp "chk-${ARCH}:/app/awadaoh" "/tmp/awadaoh-${ARCH}"
            docker rm "chk-${ARCH}" >/dev/null
            python3 tools/elfarch.py "/tmp/awadaoh-${ARCH}" --expect "$ARCH"
          done
