name: build-image

# 全量镜像：前后端都从本仓库源码构建，不再取上游预编译包。
#   前端  src/      → dist/     node 20 + vite
#   后端  service/  → awadaoh   golang 1.21 + cgo（sqlite 驱动要 cgo）
# 产出：ghcr.io/<owner>/awadaoh:latest（linux/amd64 + linux/arm64）
#
# 为什么不再用 Dockerfile.pro：
#   那条线 COPY 的是 pro/ 里的上游二进制 + 上游预编译前端包，
#   src/ 与 service/ 从来没参与打包，所以线上永远是上游那套登录页。
#   融合改动（分类三态 / 内网打码 / 前台无登录 / 左侧分类栏）只在源码里，
#   必须源码构建才生效。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 前端构建 + 自洽检查
        run: |
          set -euo pipefail
          node -v && npm -v
          npm ci --no-audit --no-fund
          npm run build

          test -f dist/index.html || { echo "::error::没有 dist/index.html"; exit 1; }
          echo "--- 标题 ---"
          grep -o '<title>[^<]*</title>' dist/index.html

          refs=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.\(js\|css\)' dist/index.html | sort -u || true)
          echo "--- index.html 引用 ---"
          echo "$refs"
          if [ -z "$refs" ]; then
            echo "::error::dist/index.html 里没有任何 assets 引用"
            exit 1
          fi
          for r in $refs; do
            if [ ! -f "dist/$r" ]; then
              echo "::error::index.html 引用了不存在的文件: $r"
              exit 1
            fi
          done
          echo "前端自洽 OK"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: service/go.sum

      - name: 后端编译 + vet（单元测试在 go-build.yml 里跑）
        working-directory: service
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 故意不用 type=gha 缓存。
          # 上一版就是这里出的问题：amd64 与 arm64 两个 platform 共用一份 gha 缓存，
          # 推出来的 linux/arm64 那一层 digest 和 amd64 完全相同，也就是
          # arm64 镜像里躺着 amd64 二进制，用户 docker compose up 直接 exec format error。
          no-cache: true

      - name: 校验已推送镜像（架构 / 首页自洽 / 品牌）
        run: |
          set -euo pipefail
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "校验镜像: $TAG"

          for ARCH in amd64 arm64; do
            docker pull --platform "linux/${ARCH}" "$TAG"
            docker create --platform "linux/${ARCH}" --name "chk-${ARCH}" "$TAG"
            docker cp "chk-${ARCH}:/app/awadaoh" "/tmp/awadaoh-${ARCH}"
            docker rm "chk-${ARCH}" >/dev/null
            python3 tools/elfarch.py "/tmp/awadaoh-${ARCH}" --expect "$ARCH"
          done

          A=$(sha256sum /tmp/awadaoh-amd64 | cut -d' ' -f1)
          B=$(sha256sum /tmp/awadaoh-arm64 | cut -d' ' -f1)
          echo "amd64: $A"
          echo "arm64: $B"
          if [ "$A" = "$B" ]; then
            echo "::error::两个架构的二进制完全相同"
            exit 1
          fi

          docker run --rm --platform linux/amd64 --entrypoint /bin/sh "$TAG" -c '
            set -e
            echo "--- 首页自洽 ---"
            grep -o "assets/index-[A-Za-z0-9_-]*\.\(js\|css\)" /app/web/index.html | sort -u > /tmp/refs
            cat /tmp/refs
            for r in $(cat /tmp/refs); do
              if [ ! -f "/app/web/$r" ]; then
                echo "!! index.html 引用了不存在的文件: $r"
                exit 1
              fi
            done
            echo "首页 chunk 自洽 OK"

            echo "--- 品牌残留 ---"
            n=$(grep -rl "Sun-Panel" /app/web 2>/dev/null | wc -l)
            echo "前端残留 Sun-Panel 文件数: $n"
            if [ "$n" != "0" ]; then
              grep -rl "Sun-Panel" /app/web | head
              exit 1
            fi
            if grep -a -q "github.com/hslr-s/sun-panel" /app/awadaoh; then
              echo "!! 二进制里还带着上游项目地址"
              exit 1
            fi
            grep -a -o "https://github.com/awahello/awadaoh" /app/awadaoh | head -1

            echo "--- 内嵌资源（//go:embed 是否真的烘进去了）---"
            cd /tmp
            /app/awadaoh -config >/dev/null 2>&1 || true
            if ! grep -q "^http_port=" /tmp/conf/conf.ini 2>/dev/null; then
              echo "!! service/assets 没被 //go:embed 烘进二进制，conf 模板写不出来"
              exit 1
            fi
            head -3 /tmp/conf/conf.ini
            echo "内嵌 conf 模板 OK"
          '
