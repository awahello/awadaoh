services:
  akkdaoh:
    image: ghcr.io/awahello/akkdaoh:latest
    container_name: akkdaoh
    volumes:
      - ./conf:/app/conf
      - ./uploads:/app/uploads
      - ./database:/app/database
      # - ./runtime:/app/runtime
    ports:
      - 3002:3002
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
