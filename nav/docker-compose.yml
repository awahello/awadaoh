services:
  nav:
    # 默认本地构建，改一行代码 docker compose up -d --build 就生效
    build:
      context: .
    # 想直接用现成镜像就注掉上面 build，打开下面这行
    # （CI 会发到 ghcr.io/<你的用户名>/awadaoh-nav:latest，首次用记得把包设为 public）
    # image: ghcr.io/awahello/awadaoh-nav:latest
    container_name: awadaoh-nav
    restart: unless-stopped
    ports:
      - "3055:3055"
    environment:
      TZ: Asia/Shanghai
      ADMIN_PASS: "admin123"
      # 自动同步：把下面的路径指到挂进来的 Bookmarks 文件（容器内路径）
      BOOKMARK_FILE: /bookmarks/Bookmarks
    volumes:
      - ./data:/app/data
      # 想把本机 Chrome 书签挂进来就打开这一行（按自己系统改左边路径）
      # Windows: C:/Users/YOU/AppData/Local/Google/Chrome/User Data/Default
      # macOS:   ~/Library/Application Support/Google/Chrome/Default
      # Linux:   ~/.config/google-chrome/Default
      - "${CHROME_PROFILE:-./bookmarks}:/bookmarks:ro"
