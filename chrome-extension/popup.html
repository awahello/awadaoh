<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #0D121E; --panel: #121927; --panel-2: #182033;
    --line: rgba(255,255,255,.075); --line-2: rgba(255,255,255,.14);
    --text: #E9EDF7; --text-2: #99A3BE; --text-3: #65708D;
    --brand: #5B6CFF; --brand-hi: #7C8AFF; --ok: #34D399; --bad: #F87171;
  }
  * { box-sizing: border-box; }
  body {
    width: 300px; margin: 0; padding: 14px;
    background: var(--bg); color: var(--text);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    font-size: 13px; line-height: 1.6;
  }
  .head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .head img { width: 26px; height: 26px; border-radius: 8px; }
  .head b { font-size: 13.5px; }
  .state {
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); padding: 10px 12px;
    font-size: 12px; color: var(--text-2); line-height: 1.6;
    word-break: break-all;
  }
  .state .t { color: var(--text-3); font-size: 11px; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; height: 34px; border: 0; border-radius: 9px;
    background: var(--brand); color: #fff; font-size: 12.5px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
  button:hover { background: var(--brand-hi); }
  button.ghost { background: transparent; border: 1px solid var(--line-2); color: var(--text-2); }
  button.ghost:hover { background: var(--panel-2); color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .foot { margin-top: 10px; font-size: 11px; color: var(--text-3); text-align: center; }
</style>
</head>
<body>
  <div class="head">
    <img src="icons/icon48.png" alt="">
    <b>Awadaoh 书签同步</b>
  </div>

  <div class="state" id="state">读取中…</div>

  <div class="actions">
    <button id="pushBtn">立即同步</button>
    <button id="optBtn" class="ghost">设置</button>
  </div>

  <div class="foot">Chrome 同步到本机的书签，推给面板</div>
<script src="popup.js"></script>
</body>
</html>
